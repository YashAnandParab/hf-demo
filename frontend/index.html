    <!--
    THESIS: Colour means "this is sourced". A RAG client earns trust by showing
    its receipts, so the one accent in the product is spent on evidence —
    citations, retrieved passages, similarity — and never on chrome. Refuses the
    category default of a violet-gradient assistant whose sources hide in a tab.
    OWN-WORLD: Warm ink ground (#12110f) with paper-neutral light twin, hairline
    rules instead of cards, brass (#d9a441) reserved for citation markers and the
    single active affordance. System sans for UI, mono only for real data:
    scores, chunk ids, page numbers. Radii 8–16px, no gradients, no glass.
    STORY: The visitor asks in plain language, watches the answer build, and can
    open any claim down to the exact indexed passage that produced it.
    FIRST VIEWPORT: Sidebar left at 274px; centered 46rem column with the mark,
    one question-shaped headline, the composer (model switcher inside it), and
    four starter questions drawn from the real corpus. Primary action is the
    brass send key at the composer's right edge.
    FORM: Reference apparatus — footnote markers, marginal evidence panel.
    Brief-pinned direction; no concept roll (the request specified the world).
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
