# Serves the built SPA and proxies the two API routes to the backend container,
# so the browser only ever talks to one origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving through a variable rather than naming `app`
    # directly in proxy_pass means nginx does NOT resolve the backend at startup —
    # otherwise it exits with "host not found in upstream" whenever the API
    # container is slower to come up, or is stopped while you ingest.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # POST /chat is a Server-Sent Events stream that stays open for the whole
    # answer. Every setting in this block exists to stop nginx from either
    # buffering the tokens into one lump at the end or cutting the stream short.
    location /chat {
        set $api http://app:8000;
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generation plus retrieval can outlast the 60s default, and a timeout here
        # looks to the UI exactly like the model going silent mid-sentence.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /models {
        set $api http://app:8000;
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The first call lands while the backend is still warming bge-m3 and the
        # reranker (~30s). Waiting beats a 504 that reads as "server is broken".
        proxy_read_timeout 120s;
    }

    # Hashed bundle filenames are immutable; index.html must never be cached, or a
    # rebuild keeps serving the old asset URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
