name: structured-rag

services:
  app:
    build: .
    image: structured-rag:latest
    container_name: structured-rag
    env_file: .env
    environment:
      # Overrides the host-oriented values in .env. Inside the network the
      # database is reached by container name on its INTERNAL port — 5433 is
      # only the mapping Docker publishes to your Windows host.
      POSTGRES_HOST: rag-postgres
      POSTGRES_PORT: 5432
      HF_HOME: /app/.hfcache
    volumes:
      - ./data:/app/data
      # The HOST HuggingFace cache, shared rather than duplicated. bge-m3 plus its
      # reranker is ~4.6GB; a container-private volume would download a second copy
      # of weights the local venv already has. Override with HF_CACHE_DIR if your
      # cache lives elsewhere.
      - ${HF_CACHE_DIR:-${USERPROFILE}/.cache/huggingface}:/app/.hfcache
    networks:
      - postgres
    command: sleep infinity
    restart: unless-stopped

networks:
  # The network the existing rag-postgres container (pgvector/pgvector:pg17)
  # already lives on. This project deliberately does NOT run its own Postgres —
  # a second one would fight over port 5433 and split your data across two
  # servers. See the README if you want a self-contained one instead.
  postgres:
    external: true
    name: postgress_default

# No named volume for the model cache any more — the host cache is bind-mounted
# above, so weights survive `docker compose down` by virtue of living outside
# Docker entirely. If you would rather keep the container isolated, swap that line
# back to `hfcache:/app/.hfcache` and restore:
#
# volumes:
#   hfcache:
